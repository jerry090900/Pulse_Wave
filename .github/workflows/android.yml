name: Build Android APK

on:
  push:
    branches: [ "main", "master", "preview/updateable" ]
  pull_request:
    branches: [ "main", "fix/ci-portable-aapt2-20261106", "feature/studio-gallery-editor-mvp-20261106", "fix/centered-bass-sync-lockscreen-20261106", "feature/one-signature-media-access-20261106", "fix/studio-overlay-visibility-20261106", "fix/preview-parity-preserve-wave-20261106", "feature/three-color-music-flow-20261106", "fix/legacy-downward-three-color-preview-20261106", "preview/updateable" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check signing setup script syntax
        run: bash -n scripts/setup-preview-signing.sh
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      # PR builds run regression tests without access to the permanent signing key.
      # Publish an installable Preview only from this owner's trusted branch.
      - name: Build CI-only debug APK (not for installation)
        if: github.event_name != 'push' || github.ref != 'refs/heads/preview/updateable'
        run: gradle :app:assembleDebug --stacktrace
      - name: Assign increasing versionCode for updateable Preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/updateable'
        run: |
          echo "PW_PREVIEW_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Restore permanent Preview keystore (trusted branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/updateable'
        env:
          KEYSTORE_BASE64: ${{ secrets.PW_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing PW_PREVIEW_KEYSTORE_BASE64. Do not publish throwaway-signed APKs."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulsewave-preview-signing.jks"
          test -s "$RUNNER_TEMP/pulsewave-preview-signing.jks"
      - name: Build persistently signed updateable Preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/updateable'
        env:
          PW_REQUIRE_STABLE_SIGNING: 'true'
          PW_PREVIEW_KEYSTORE_FILE: ${{ runner.temp }}/pulsewave-preview-signing.jks
          PW_PREVIEW_STORE_PASSWORD: ${{ secrets.PW_PREVIEW_STORE_PASSWORD }}
          PW_PREVIEW_KEY_ALIAS: ${{ secrets.PW_PREVIEW_KEY_ALIAS }}
          PW_PREVIEW_KEY_PASSWORD: ${{ secrets.PW_PREVIEW_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify this APK cannot replace installed PulseWave
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/pulsewave-preview-badging.txt
          grep -q "name='com.jerry.sharpwave.preview'" /tmp/pulsewave-preview-badging.txt
          grep -q "versionCode='${PW_PREVIEW_VERSION_CODE:-7}'" /tmp/pulsewave-preview-badging.txt
          grep -q "application-label:'PulseWave Preview'" /tmp/pulsewave-preview-badging.txt
      - name: Verify built APK size and Studio classes
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile

          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              raise SystemExit("APK missing")
          print("APK_BYTES:", apk.stat().st_size)
          print("APK_SHA256:", hashlib.sha256(apk.read_bytes()).hexdigest())
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("Corrupt APK entry: " + bad)
              names = z.namelist()
              dex_files = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
              print("APK_ENTRIES:", len(names))
              print("DEX_FILES:", dex_files)
              print("HAS_ANDROID_MANIFEST:", "AndroidManifest.xml" in names)
              if not dex_files or "AndroidManifest.xml" not in names:
                  raise SystemExit("Missing DEX or AndroidManifest.xml")
              data = b"".join(z.read(n) for n in dex_files)
              for cls in ("StudioActivity", "StudioPreset", "StudioStore", "StudioPreviewView", "MainActivity", "OverlayService", "MusicSessionListener", "StudioAudioRenderer", "MusicColorFlow", "StudioColorPicker"):
                  descriptor = ("Lcom/jerry/sharpwave/" + cls + ";").encode()
                  found = descriptor in data
                  print("DEX_CLASS_" + cls + ":", found)
                  if not found:
                      raise SystemExit("Required class missing: " + cls)
          PY
      - name: Verify pinned permanent signing certificate before publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/updateable'
        env:
          EXPECTED_PREVIEW_SHA256: ${{ vars.PW_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_PREVIEW_SHA256" ]; then
            echo "::error::Missing PW_PREVIEW_CERT_SHA256 repository variable; refusing to distribute."
            exit 1
          fi
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$ACTUAL" ] || [ "${ACTUAL,,}" != "${EXPECTED_PREVIEW_SHA256,,}" ]; then
            echo "::error::Unexpected Preview signing certificate. Refusing to distribute an unupdateable APK."
            exit 1
          fi
          echo "Persistent Preview signer verified: $ACTUAL"
      - name: Upload updateable Preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/preview/updateable'
        uses: actions/upload-artifact@v4
        with:
          name: PulseWave-Preview-UPDATEABLE-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

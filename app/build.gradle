plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jerry.sharpwave'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jerry.sharpwave'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '0.1.5'
    }

    buildTypes {
        debug {
            // Only the temporary preview build uses a separate installation identity.
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
